# Catálogo de casos de prueba — <NOMBRE_DEL_BOT>
#
# Cada caso de uso de docs/diseno/solucion.md debe tener al menos un caso acá:
# el verificador del release rechaza la puesta en producción si falta alguno.
#
# Campos:
#   id                  CP-XXX, único y estable en el tiempo
#   descripcion         Qué se prueba, en una oración
#   funcionalidad       Qué parte del bot cubre
#   casos_uso           Lista de CU-XXX del diseño que este caso verifica
#   tipo                "automatizada" (la ejecuta pytest) o "manual" (la ejecuta una persona)
#   prueba              Solo si es automatizada: ruta::nombre_del_test
#   pasos               Solo si es manual: pasos a seguir
#   resultado_esperado  Qué tiene que pasar para que el caso se considere exitoso

