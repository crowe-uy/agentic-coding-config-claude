# Validación automática del proyecto.
#
# Hoy el equipo no tiene GitHub Actions habilitado, así que este workflow solo
# se ejecuta a mano desde la pestaña Actions. Cuando Actions esté disponible,
# descomentar el bloque "pull_request" para que corra en cada PR.

name: Validación

on:
  workflow_dispatch:
  # pull_request:
  #   branches: [dev, main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Formato y lint
        run: |
          ruff format --check .
          ruff check .

      - name: Pruebas
        run: python -m pytest -q

      - name: Escaneo de secretos
        run: python .github/escanear_secretos.py --rango origin/${{ github.base_ref }}..HEAD
