[project]
name = "agentic-coding-config"
version = "1.0.0"
description = "Configuracion agentica del equipo de automatizaciones"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "ARG", "PTH", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"pruebas/*" = ["ARG"]
"plugins/automatizaciones/plantilla-bot/*" = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
addopts = "--strict-markers"
